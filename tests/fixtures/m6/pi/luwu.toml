version = 7

[roots]
source = "home/repo"
inputs = "home/inputs"
target = "home"

[resources.pi]
kind = "template"
source = "templates/pi-agent-settings.json.j2"
target = ".pi/agent/settings.json"
owner = "fields"
scope = "fields"
comparison = "json"
content_sensitivity = "public"
baseline = "baselines/pi.json"
inputs = { defaultModel = "global/pi.json", defaultProvider = "local/pi.json", lastChangelogVersion = "local/pi.json" }

[resources.pi.fields]
defaultModel = "source"
defaultProvider = "live"
lastChangelogVersion = "source"
