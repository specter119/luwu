version = 8

[roots]
source = "repo"
inputs = "inputs"
target = "home"

[profiles.synthetic]
packages = ["payloads", "formats"]
exclude = []

[profiles.wsl]
packages = ["payloads", "formats", "mihomo"]
exclude = ["mihomo"]

[profiles.alias]
packages = ["formats", "alias_probe"]
exclude = []

[profiles.shared_consumer]
packages = ["shared_consumer"]
exclude = []

[profiles.official_shapes]
packages = ["official_apps"]
exclude = []

[profiles.droid_settings]
packages = ["official_droid"]
exclude = []

[profiles.finite_batch]
packages = ["finite_batch"]
exclude = []

[packages.foundation]
dependencies = []
resources = ["copy_profile"]

[packages.formats]
dependencies = ["foundation"]
resources = ["settings", "nested_toml"]

[packages.payloads]
dependencies = ["foundation"]
resources = ["assets"]

[packages.alias_probe]
dependencies = ["formats"]
resources = ["settings_alias"]

[packages.shared_consumer]
dependencies = ["foundation"]
resources = ["settings_shared", "nested_toml_consumer"]

[packages.mihomo]
dependencies = []
resources = ["mihomo"]

[packages.official_apps]
dependencies = []
resources = ["opencode", "codex", "droid"]

[packages.official_droid]
dependencies = []
resources = ["droid"]

[packages.finite_batch]
dependencies = []
resources = ["batch_a", "batch_b", "batch_c"]

[inputs.theme]
layers = [
  { file = "global/settings.jsonc", path = ["values", "theme"], format = "jsonc" },
  { file = "local/settings.jsonc", path = ["overrides", "theme"], format = "jsonc" },
]
reverse_to = { file = "local/settings.jsonc", path = ["overrides", "theme"], format = "jsonc" }

[inputs.settings_theme]
layers = [
  { file = "local/settings-theme.jsonc", path = ["theme"], format = "jsonc" },
]
reverse_to = { file = "local/settings-theme.jsonc", path = ["theme"], format = "jsonc" }

[inputs.brand]
layers = [
  { file = "global/settings.jsonc", path = ["values", "brand"], format = "jsonc" },
]

[inputs.worker_name]
layers = [
  { file = "global/runtime.toml", path = ["automation", "worker", "name"], format = "toml" },
  { file = "local/runtime.toml", path = ["overrides", "automation", "worker", "name"], format = "toml" },
]
reverse_to = { file = "local/runtime.toml", path = ["overrides", "automation", "worker", "name"], format = "toml" }

[inputs.mihomo_only]
layers = [
  { file = "local/mihomo-exclusive/state.jsonc", path = ["trusted"], format = "jsonc" },
]
reverse_to = { file = "local/mihomo-exclusive/state.jsonc", path = ["trusted"], format = "jsonc" }

[inputs.runtime_theme]
layers = [
  { file = "global/runtime.toml", path = ["display", "theme"], format = "toml" },
]

[inputs.opencode_schema]
layers = [
  { file = "global/opencode.jsonc", path = ["schema"], format = "jsonc" },
]

[inputs.opencode_model]
layers = [
  { file = "local/opencode.jsonc", path = ["model"], format = "jsonc" },
]
reverse_to = { file = "local/opencode.jsonc", path = ["model"], format = "jsonc" }

[inputs.opencode_autoupdate]
layers = [
  { file = "local/opencode.jsonc", path = ["autoupdate"], format = "jsonc" },
]
reverse_to = { file = "local/opencode.jsonc", path = ["autoupdate"], format = "jsonc" }

[inputs.opencode_port]
layers = [
  { file = "local/opencode.jsonc", path = ["server", "port"], format = "jsonc" },
]
reverse_to = { file = "local/opencode.jsonc", path = ["server", "port"], format = "jsonc" }

[inputs.opencode_hostname]
layers = [
  { file = "local/opencode.jsonc", path = ["server", "hostname"], format = "jsonc" },
]
reverse_to = { file = "local/opencode.jsonc", path = ["server", "hostname"], format = "jsonc" }

[inputs.codex_project_trust]
layers = [
  { file = "local/codex-runtime.toml", path = ["official", "project_trust"], format = "toml" },
]
reverse_to = { file = "local/codex-runtime.toml", path = ["official", "project_trust"], format = "toml" }

[inputs.codex_hook_enabled]
layers = [
  { file = "local/codex-runtime.toml", path = ["official", "hook_enabled"], format = "toml" },
]
reverse_to = { file = "local/codex-runtime.toml", path = ["official", "hook_enabled"], format = "toml" }

[inputs.codex_hook_trusted_hash]
layers = [
  { file = "local/codex-runtime.toml", path = ["official", "hook_trusted_hash"], format = "toml" },
]
reverse_to = { file = "local/codex-runtime.toml", path = ["official", "hook_trusted_hash"], format = "toml" }

[inputs.droid_interaction_mode]
layers = [
  { file = "local/droid-settings.json", path = ["sessionDefaultSettings", "interactionMode"], format = "json" },
]
reverse_to = { file = "local/droid-settings.json", path = ["sessionDefaultSettings", "interactionMode"], format = "json" }

[inputs.droid_autonomy_level]
layers = [
  { file = "local/droid-settings.json", path = ["sessionDefaultSettings", "autonomyLevel"], format = "json" },
]
reverse_to = { file = "local/droid-settings.json", path = ["sessionDefaultSettings", "autonomyLevel"], format = "json" }

[inputs.batch_a]
layers = [
  { file = "local/finite-batch-a.json", path = ["value"], format = "json" },
]

[inputs.batch_b]
layers = [
  { file = "local/finite-batch-b.json", path = ["value"], format = "json" },
]

[inputs.batch_c]
layers = [
  { file = "local/finite-batch-c.json", path = ["value"], format = "json" },
]

[resources.settings]
source = "templates/settings.jsonc.j2"
target = ".config/demo/settings.jsonc"
format = "jsonc"
content_sensitivity = "public"
baseline = "baselines/settings.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.settings.fields.theme]
path = ["ui", "theme"]
owner = "merge"
input = "settings_theme"

[resources.settings.fields.brand]
path = ["ui", "brand"]
owner = "source"
input = "brand"

[resources.settings_shared]
source = "templates/settings-shared.jsonc.j2"
target = ".config/demo/shared/settings.jsonc"
format = "jsonc"
content_sensitivity = "public"
baseline = "baselines/settings-shared.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.settings_shared.fields.theme]
path = ["ui", "theme"]
owner = "merge"
input = "theme"

[resources.settings_shared.fields.brand]
path = ["ui", "brand"]
owner = "source"
input = "brand"

[resources.settings_alias]
source = "templates/settings-alias.jsonc.j2"
target = ".config/demo/alias/settings.jsonc"
format = "jsonc"
content_sensitivity = "public"
baseline = "baselines/settings-alias.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.settings_alias.fields.theme]
path = ["ui", "theme"]
owner = "merge"
input = "theme"

[resources.nested_toml]
source = "templates/nested.toml.j2"
target = ".config/demo/deep/profile/runtime.toml"
format = "toml"
content_sensitivity = "public"
baseline = "baselines/nested-toml.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.nested_toml.fields.theme]
path = ["display", "theme"]
owner = "live"
input = "runtime_theme"

[resources.nested_toml.fields.worker_name]
path = ["automation", "worker", "name"]
owner = "merge"
input = "worker_name"

[resources.nested_toml_consumer]
source = "templates/nested-shared.toml.j2"
target = ".config/demo/shared/runtime.toml"
format = "toml"
content_sensitivity = "public"
baseline = "baselines/nested-toml-consumer.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.nested_toml_consumer.fields.theme]
path = ["display", "theme"]
owner = "merge"
input = "theme"

[resources.copy_profile]
deploy = "copy"
source = "copies/profile.ini"
target = ".config/demo/profile.ini"
baseline = "baselines/profile.json"
content_sensitivity = "public"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.assets]
deploy = "copy"
source = "assets"
target = ".config/demo/assets"
baseline = "baselines/assets"
content_sensitivity = "public"
recursive = true
exclude = ["*.ignored"]
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.mihomo]
source = "templates/mihomo.jsonc.j2"
target = ".config/mihomo/config.jsonc"
format = "jsonc"
content_sensitivity = "public"
baseline = "baselines/mihomo.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.mihomo.fields.placeholder]
path = ["placeholder"]
owner = "merge"
input = "mihomo_only"

[resources.opencode]
source = "templates/opencode.jsonc.j2"
target = ".config/opencode/opencode.jsonc"
format = "jsonc"
content_sensitivity = "public"
baseline = "baselines/opencode.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.opencode.fields.schema]
path = ["$schema"]
owner = "source"
input = "opencode_schema"

[resources.opencode.fields.model]
path = ["model"]
owner = "live"
input = "opencode_model"

[resources.opencode.fields.autoupdate]
path = ["autoupdate"]
owner = "live"
input = "opencode_autoupdate"

[resources.opencode.fields.port]
path = ["server", "port"]
owner = "live"
input = "opencode_port"

[resources.opencode.fields.hostname]
path = ["server", "hostname"]
owner = "live"
input = "opencode_hostname"

[resources.codex]
source = "templates/codex.toml.j2"
target = ".codex/config.toml"
format = "toml"
content_sensitivity = "public"
baseline = "baselines/codex.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.codex.fields.project_trust]
path = ["projects", "/synthetic/luwu-demo/project.a", "trust_level"]
owner = "live"
input = "codex_project_trust"

[resources.codex.fields.hook_enabled]
path = ["hooks", "state", "/synthetic/luwu-demo/hooks.json:pre_tool_use:0:0", "enabled"]
owner = "live"
input = "codex_hook_enabled"

[resources.codex.fields.hook_trusted_hash]
path = ["hooks", "state", "/synthetic/luwu-demo/hooks.json:pre_tool_use:0:0", "trusted_hash"]
owner = "live"
input = "codex_hook_trusted_hash"

[resources.droid]
source = "templates/droid-settings.json.j2"
target = ".factory/settings.json"
format = "json"
content_sensitivity = "public"
baseline = "baselines/droid-settings.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.droid.fields.interaction_mode]
path = ["sessionDefaultSettings", "interactionMode"]
owner = "live"
input = "droid_interaction_mode"

[resources.droid.fields.autonomy_level]
path = ["sessionDefaultSettings", "autonomyLevel"]
owner = "live"
input = "droid_autonomy_level"

[resources.batch_a]
source = "templates/finite-batch-a.json.j2"
target = ".config/demo/finite/a.json"
format = "json"
content_sensitivity = "public"
baseline = "baselines/finite-batch-a.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.batch_a.fields.value]
path = ["value"]
owner = "source"
input = "batch_a"

[resources.batch_b]
source = "templates/finite-batch-b.json.j2"
target = ".config/demo/finite/b.json"
format = "json"
content_sensitivity = "public"
baseline = "baselines/finite-batch-b.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.batch_b.fields.value]
path = ["value"]
owner = "source"
input = "batch_b"

[resources.batch_c]
source = "templates/finite-batch-c.json.j2"
target = ".config/demo/finite/c.json"
format = "json"
content_sensitivity = "public"
baseline = "baselines/finite-batch-c.json"
parents = "create"
parent_mode = "0700"
mode = "0600"

[resources.batch_c.fields.value]
path = ["value"]
owner = "source"
input = "batch_c"
