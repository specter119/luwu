# Native prek configuration for Luwu.
# Hook repositories are pinned to immutable commits for reviewable updates.
minimum_prek_version = "0.4.12"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"
priority = 2

[[repos.hooks]]
id = "forbid-new-submodules"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
priority = 2

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.17"

[[repos.hooks]]
id = "uv-lock"
args = ["--check"]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "0.26"

[[repos.hooks]]
id = "validate-pyproject"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.8"

[[repos.hooks]]
id = "ruff-check"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
types_or = ["python", "pyi"]
require_serial = true

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.82"

[[repos.hooks]]
id = "ty"
args = ["--locked"]
always_run = true
pass_filenames = false
require_serial = true

[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "1.0.0"

[[repos.hooks]]
id = "mdformat"
args = ["--wrap", "keep"]
# The front-matter plugin keeps SKILL.md metadata parseable while formatting
# the Markdown body.
additional_dependencies = [
    "mdformat-gfm==1.0.0",
    "mdformat-front-matters==2.0.0",
]
