# Native prek configuration for Luwu.
# Hook repositories are pinned to immutable commits for reviewable updates.
minimum_prek_version = "0.4.12"

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "end-of-file-fixer"
priority = 2

[[repos.hooks]]
id = "forbid-new-submodules"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md"]
priority = 2

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "856f55170f70dc7523c45a215ecdedc44709e2a6" # frozen: 0.12.6

[[repos.hooks]]
id = "uv-lock"
args = ["--check"]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7" # frozen: v0.25

[[repos.hooks]]
id = "validate-pyproject"

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "fb5d707e08fe0d2578b155458fdd53b6782dcab2" # frozen: v8.29.1

[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "aab412d509121cb5f7533134b7e67f9fab59c682" # frozen: v0.16.4

[[repos.hooks]]
id = "ruff-check"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
types_or = ["python", "pyi"]
require_serial = true

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "1241d80d7f628b8b0c60540b7a8c83b947136a4f" # frozen: v0.0.74

[[repos.hooks]]
id = "ty"
args = ["--locked"]
always_run = true
pass_filenames = false
require_serial = true

[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "82912cdaea4fb830f751504486a7879c70526547" # frozen: 1.0.0

[[repos.hooks]]
id = "mdformat"
args = ["--wrap", "keep"]
additional_dependencies = ["mdformat-gfm==1.0.0"]
