name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run python -B -m unittest discover -s tests
      - run: uvx ruff check src tests
      - run: uvx ruff format --check src tests
      - run: uv run python -m compileall -q src tests
      - run: uv lock --check
      - run: uv build

  package-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: uv build --out-dir dist
      - run: uv venv --python 3.12 .venv-wheel
      - run: uv pip install --python .venv-wheel/bin/python dist/*.whl
      - run: .venv-wheel/bin/luwu --version
      - run: .venv-wheel/bin/python -B -m unittest discover -s tests
      - run: uv venv --python 3.12 .venv-sdist
      - run: uv pip install --python .venv-sdist/bin/python dist/*.tar.gz
      - run: .venv-sdist/bin/luwu --version
      - run: .venv-sdist/bin/python -B -m unittest discover -s tests
