[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "luwu"
version = "0.1.0"
description = "A configuration orchestrator for dotfiles, developer tools, and agent configuration."
requires-python = ">=3.12"
dependencies = [
    "Jinja2>=3.1,<4",
]

[project.scripts]
luwu = "luwu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luwu"]
